networks:
  web:
  internal:

services:
  pollapp:
    image: # poll image name
    container_name: django-app
    labels:
      - traefik.port=80
    networks:
      - internal
      - web
    depends_on:
      - db

  db:
    image: postgres:latest
    container_name: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    networks:
      - internal
    labels:
      - traefik.enable=false

  adminer:
    image: adminer:standalone
    container_name: db-dashboard
    labels:
      - traefik.http.routers.adminer.rule=Host('db-admin.localhost')
      - traefik.port=8080
    networks:
      - internal
      - web
    depends_on:
      - db

  traefik:
    image: traefik:latest
    container_name: reverse-proxy
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 80:80
    networks:
      - web
